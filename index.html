<style>
:root{
  --bg1:#e6f2f1;--bg2:#cfe6ea;--ink:#16424a;--sub:#5d8a90;
  --glass:rgba(255,255,255,.28);--glass-b:rgba(255,255,255,.6);--accent:#2f9c95;--accent2:#3d7fa8;--empty:rgba(255,255,255,.35);--sheet:rgba(235,246,246,.82);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#0f2a2f;--bg2:#12334a;--ink:#dff1ef;--sub:#86b3b6;
  --glass:rgba(255,255,255,.09);--glass-b:rgba(255,255,255,.2);--accent:#5cc6bb;--accent2:#6aa8d0;--empty:rgba(255,255,255,.06);--sheet:rgba(18,46,56,.85);}}
:root[data-theme="dark"]{
  --bg1:#0f2a2f;--bg2:#12334a;--ink:#dff1ef;--sub:#86b3b6;
  --glass:rgba(255,255,255,.09);--glass-b:rgba(255,255,255,.2);--accent:#5cc6bb;--accent2:#6aa8d0;--empty:rgba(255,255,255,.06);--sheet:rgba(18,46,56,.85);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg2) linear-gradient(160deg,var(--bg1),var(--bg2)) no-repeat;background-size:100% 100%}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{position:fixed;inset:0}
body{color:var(--ink);font-family:-apple-system,"Helvetica Neue",sans-serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:560px;height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(22px + env(safe-area-inset-top,0px)) 18px 110px}
.wrap::-webkit-scrollbar{width:0;height:0;display:none}.wrap::-webkit-scrollbar-thumb{background:transparent}
#in{transform-origin:top center}
h1{font-size:22px;margin:6px 0 2px;font-weight:600;letter-spacing:.3px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 12% 10%,rgba(61,170,180,.5),transparent 42%),radial-gradient(circle at 90% 36%,rgba(70,130,200,.42),transparent 46%),radial-gradient(circle at 28% 94%,rgba(60,190,165,.4),transparent 46%)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.quip{margin-top:6px;font-size:14px;font-style:italic;color:var(--accent)}
.date,.hint,.sub{color:var(--sub);font-size:14px}
.hint{font-size:12px;margin-top:10px}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(32px) saturate(190%);-webkit-backdrop-filter:blur(32px) saturate(190%);border-radius:22px;box-shadow:0 10px 34px rgba(30,90,100,.16),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12)}
button{font:inherit;color:inherit;cursor:pointer}
.card{padding:18px;margin-top:16px}
.top{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:26px;line-height:1}.ring span{font-size:11px;color:var(--sub);margin-top:3px}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:12px;color:var(--sub)}
.main{width:100%;margin-top:16px;padding:16px;font-size:17px;font-weight:600;text-align:center}
.on{background:linear-gradient(135deg,rgba(47,156,149,.55),rgba(61,127,168,.5))}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sq{width:38px;height:38px;border-radius:12px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-size:12px;color:var(--sub);text-align:center;padding-bottom:2px}
.d{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:var(--empty);display:flex;align-items:center;justify-content:center;font-size:14px;position:relative}
.d.has{background:linear-gradient(135deg,rgba(47,156,149,.55),rgba(61,127,168,.5));color:#fff;font-weight:600}
.d.today{border-color:var(--accent)}
.d.x{background:none;pointer-events:none}
.d i{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row+.row{margin-top:14px}
.step{display:flex;align-items:center;gap:12px}
.seg{display:flex;gap:6px}.seg button{padding:7px 12px;border-radius:12px;font-size:14px}
.btn{padding:11px 16px;border-radius:14px;font-size:15px}
.entry{display:block;width:100%;text-align:left;padding:14px 16px;margin-top:10px}
.entry b{font-size:13px;color:var(--sub);font-weight:500}
.entry p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.45}
textarea{width:100%;border:1px solid var(--glass-b);background:var(--empty);color:var(--ink);border-radius:14px;padding:12px;font:inherit;font-size:16px;line-height:1.45;resize:none;outline:none}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 18px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs div{pointer-events:auto;display:flex;gap:4px;padding:6px;width:100%;max-width:420px}
.tabs button{flex:1;padding:11px 0;border:0;background:none;border-radius:14px;font-size:14px;color:var(--sub)}
.tabs button.a{color:#fff;background:linear-gradient(135deg,rgba(47,156,149,.7),rgba(61,127,168,.65))}
#sheet{position:fixed;inset:0;background:rgba(10,40,48,.3);display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.show{display:flex}
.panel{width:100%;max-width:560px;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--sheet);border:1px solid var(--glass-b);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.panel h2{margin:0 0 12px;font-size:18px;font-weight:600}
.panel textarea{height:100px;margin-top:12px}
.d.rest{background:var(--rest-bg);color:var(--rest-ink);font-weight:600}
.d.rest i{background:var(--rest-ink)}
.main.restOn{background:var(--rest-bg);color:var(--rest-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:8px 12px;border-radius:14px;font-size:13px}.chip.on{color:#fff}
.tg{font-size:12px;color:var(--accent);margin-top:4px}
:root{--rest-bg:linear-gradient(135deg,rgba(226,200,150,.6),rgba(236,216,176,.5));--rest-ink:#5a4a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rest-bg:linear-gradient(135deg,rgba(200,170,110,.38),rgba(170,140,90,.30));--rest-ink:#f1e4c6}}
:root[data-theme="dark"]{--rest-bg:linear-gradient(135deg,rgba(200,170,110,.38),rgba(170,140,90,.30));--rest-ink:#f1e4c6}
.panel{max-height:88%;overflow-y:auto}
</style>
</head>

norm();
function snap(j){try{var q=JSON.parse(localStorage.getItem(K+'-snap')||'{}');q[tk]=j;var ks=Object.keys(q).sort();while(ks.length>7)delete q[ks.shift()];localStorage.setItem(K+'-snap',JSON.stringify(q))}catch(e){}}
function save(){try{var j=JSON.stringify(S),p=localStorage.getItem(K);if(p&&p!==j)localStorage.setItem(K+'-prev',p);localStorage.setItem(K,j);snap(j)}catch(e){}}
var pad=function(n){return String(n).padStart(2,'0')};
var key=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var pk=function(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
var fmt=function(k){return k.replace(/-/g,'.')};
var esc=function(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};
var $=function(i){return document.getElementById(i)};
var now=new Date(),tk=key(now),view=new Date(now.getFullYear(),now.getMonth(),1),tab='home',cur=tk,msg='';

function applyTheme(){var r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);}
function stats(){
  var mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  var wk=0;for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);if(isW(S.days[key(d)]))wk++;}
  var pre=now.getFullYear()+'-'+pad(now.getMonth()+1),ks=Object.keys(S.days);
  var c=new Date(now),s=0;if(!isW(S.days[tk]))c.setDate(c.getDate()-1);
  while(isW(S.days[key(c)])){s++;c.setDate(c.getDate()-1);}
  return {wk:wk,mo:ks.filter(function(k){return k.indexOf(pre)===0&&isW(S.days[k])}).length,tt:ks.filter(function(k){return isW(S.days[k])}).length,st:s};
}
var Q1=['Small steps still count.','Your shoes are waiting.','Do it for the you of ten years from now.','The hardest rep is the doorway.','Sweat now, sleep better tonight.','Be a little stubborn today.','Easy does it, but do it.','Nobody regrets the workout after.','Make the playlist loud.','Show up, then see.','Ten minutes beats zero.','Just begin. The rest follows.','Slow is still moving.','Lace up first, think later.','One set, then decide.','Gentle days count too.','No hurry. Only forward.','Your future self says thanks.','Warm up and see how it feels.','Quiet effort adds up.'];
var Q2=['That felt good, admit it.','Shower, snack, smile.','Tomorrow can rest. Today was yours.','Look at you, showing up.','Protein and a nap sound right.','Another quiet win.','Your muscles are writing thank-you notes.','Nice. One more in the books.','Logged. Go drink some water.','Quiet progress, well done.','Stack another brick.','Rest well, you earned it.','Good. Now stretch a little.'];
var MS={10:'Ten. This is becoming a habit.',25:'Twenty-five. Your body noticed.',50:'Fifty. Quietly impressive.',100:'One hundred. Look how far you came.',150:'One fifty. This is just who you are now.',200:'Two hundred. Unreal.'};
function pick(id,n){var l=-1,i,v;try{v=localStorage.getItem('fit-q-'+id);l=v===null?-1:+v;}catch(e){}do{i=Math.floor(Math.random()*n);}while(i===l&&n>1);try{localStorage.setItem('fit-q-'+id,i);}catch(e){}return i;}
var qa=pick('a',Q1.length),qb=pick('b',Q2.length);
function quip(){var t=stats().tt,w=isW(S.days[tk]);if(w&&MS[t])return MS[t];return w?Q2[qb]:Q1[qa];}
function past(){
  var ks=Object.keys(S.days).filter(function(k){return S.days[k].n&&k!==tk}).sort();
  if(!ks.length)return '';
  var k=ks[Math.floor((now.getTime()-now.getTimezoneOffset()*6e4)/864e5)%ks.length];
  return '<button class="entry glass" data-k="'+k+'" style="margin-top:16px"><b>From '+fmt(k)+'</b><p class="clamp">'+esc(S.days[k].n)+'</p></button>';
}
function home(){
  var s=stats(),g=S.goal,has=isW(S.days[tk]);
  var h='<h1>Tide</h1><div class="date">'+tk.replace(/-/g,'.')+'</div><div class="quip">'+quip()+'</div>';
  h+='<div class="card glass"><div class="top"><div class="ring"><svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="var(--empty)" stroke-width="9"/><circle cx="52" cy="52" r="44" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="'+(276.46*(1-Math.min(1,s.mo/(new Date(now.getFullYear(),now.getMonth()+1,0).getDate()/2))))+'"/></svg><div class="n"><b>'+s.mo+'</b><span>this month</span></div></div>';
  h+='<div class="stats" style="grid-template-columns:repeat(2,1fr)"><div><b>'+s.tt+'</b><span>Total</span></div><div><b>'+Object.keys(S.days).filter(function(k){return S.days[k].n}).length+'</b><span>Notes</span></div></div></div>';
  h+='<button class="main glass'+(has?' on':'')+'" id="main">'+(has?'Done today ✓':'I worked out today')+'</button></div>'+past();
  h+='<div class="card glass"><div class="mh"><button class="sq glass" id="prev">‹</button><b>'+view.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</b><button class="sq glass" id="next">›</button></div><div class="grid">';
  h+=['M','T','W','T','F','S','S'].map(function(x){return '<div class="wd">'+x+'</div>'}).join('');
  var first=(view.getDay()+6)%7,dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  for(var i=0;i<first;i++)h+='<div class="d x"></div>';
  for(var n=1;n<=dim;n++){
    var k=view.getFullYear()+'-'+pad(view.getMonth()+1)+'-'+pad(n),v=S.days[k];
    h+='<button class="d'+(v?(v.r?' rest':' has'):'')+(k===tk?' today':'')+'" data-k="'+k+'">'+n+(v&&v.n?'<i></i>':'')+'</button>';
  }
  var oldbk=Object.keys(S.days).length>=5&&(!S.lastBackup||Date.now()-S.lastBackup>12096e5);return h+'</div><div class="hint">Tap a day to add a note or log a past workout</div></div>'+(oldbk?'<div class="hint" style="text-align:center;margin-top:18px">Tip: tap Save in Settings to keep a backup in Notes or Files.</div>':'');
}
function journal(){
  var ks=Object.keys(S.days).filter(function(k){return S.days[k].n}).sort().reverse();
  var h='<h1>Journal</h1><div class="date">'+ks.length+' note'+(ks.length===1?'':'s')+'</div>';
  if(!ks.length)return h+'<div class="card glass sub">Nothing here yet. One honest line is plenty.</div>';
  return h+ks.map(function(k){var v=S.days[k];return '<button class="entry glass" data-k="'+k+'"><b>'+fmt(k)+(v.r?' · Rest day':'')+'</b>'+(v.t&&v.t.length?'<div class="tg">'+v.t.join(' · ')+'</div>':'')+'<p>'+esc(v.n)+'</p></button>'}).join('');
}
function settings(){
  var th=['auto','light','dark'];
  return '<h1>Settings</h1><div class="date">Version '+VER+'</div>'+
  '<div class="card glass">'+
  '<div class="row"><span>Appearance<br><span class="sub" style="font-size:12px">Auto follows your device</span></span><div class="seg">'+th.map(function(t){return '<button class="glass'+(S.theme===t?' on':'')+'" data-th="'+t+'">'+t[0].toUpperCase()+t.slice(1)+'</button>'}).join('')+'</div></div></div>'+
  '<div class="card glass"><div class="row"><span>Backup</span><div class="seg"><button class="glass" id="bshare">Save</button><button class="glass" id="bcopy">Copy</button><button class="glass" id="brest">Restore</button></div></div>'+
  '<textarea id="bk" rows="3" style="margin-top:12px" placeholder="Copy shows your data here. Paste data here, then Restore."></textarea><div class="hint" id="bm">'+esc(msg||('Last backup: '+(S.lastBackup?fmt(key(new Date(S.lastBackup))):'never')))+'</div></div>'+
  '<div class="card glass"><div class="row"><span>Auto-backups<br><span class="sub" style="font-size:12px">Last 7 days, kept on this device.</span></span><button class="btn glass" id="bauto">Go back</button></div></div><div class="hint" style="text-align:center;margin-top:22px">Made quietly. Kept on this device.</div>';
}
function render(){try{renderMain()}catch(e){fail()}}
function fit(){var a=document.querySelector('.wrap'),n=$('in');if(!n)return;n.style.transform='';n.style.marginBottom='';if(tab==='journal')return;var cs=getComputedStyle(a),av=a.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),nd=n.offsetHeight;if(av>0&&nd>av){var z=Math.max(.8,av/nd);n.style.transform='scale('+z+')';n.style.marginBottom=(-(nd*(1-z)))+'px'}}
addEventListener('resize',fit);
function fail(){$('app').className='';$('app').innerHTML='<div class="card glass"><b>Something went wrong.</b><p class="sub">Your records are safe. Tap Copy and keep the text in Notes, then tap Reload.</p><textarea id="bk" rows="4"></textarea><div class="row" style="margin-top:12px"><button class="btn glass" id="bcopy">Copy</button><button class="btn glass on" id="upg">Reload</button></div><div class="hint" id="bm"></div></div>'}
function renderMain(){
  $('app').innerHTML='<div id="in">'+(tab==='home'?home():tab==='journal'?journal():settings())+'</div>';fit();
  $('tabs').innerHTML=[['home','Home'],['journal','Journal'],['settings','Settings']].map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'a':'')+'">'+t[1]+'</button>'}).join('');
}
function openSheet(k){
  cur=k;var v=S.days[k];
  $('sh').textContent=fmt(k);$('note').value=v?v.n:'';sheetState();
  $('sheet').classList.add('show');
}
var TGS=['Abs','Legs','Arms','Chest','Back','Shoulders','Full body','Cardio','Stretch'];
function sheetState(){var v=S.days[cur],w=isW(v),r=!!(v&&v.r),b=$('sdone'),b2=$('srest');
  b.className='main glass'+(w?' on':'');b.textContent=w?'Worked out ✓':'Worked out';
  b2.className='main glass'+(r?' restOn':'');b2.textContent=r?'Rest day ✓':'Rest day';
  $('sm').textContent=w?'Tap Worked out again to remove':r?'Tap Rest day again to remove':'';
  $('tags').innerHTML=w?TGS.map(function(x){return '<button class="chip glass'+((v.t||[]).indexOf(x)>-1?' on':'')+'" data-tg="'+x+'">'+x+'</button>'}).join(''):'';}
$('sdone').onclick=function(){var v=S.days[cur];
  if(isW(v)){if(v.n&&!confirm('Remove this day and its note?'))return;delete S.days[cur];$('note').value='';}
  else S.days[cur]={n:$('note').value,t:(v&&v.t)||[]};
  save();sheetState();render();
};
$('srest').onclick=function(){var v=S.days[cur];
  if(v&&v.r){if(v.n&&!confirm('Remove this day and its note?'))return;delete S.days[cur];$('note').value='';}
  else S.days[cur]={n:$('note').value,t:[],r:1};
  save();sheetState();render();
};
$('note').oninput=function(){
  if(!S.days[cur])S.days[cur]={n:''};
  S.days[cur].n=this.value;save();sheetState();
};
function closeSheet(){$('sheet').classList.remove('show');render();}
$('sclose').onclick=closeSheet;
$('sheet').onclick=function(e){if(e.target===this)closeSheet();};

document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;msg='';render();document.querySelector('.wrap').scrollTop=0;return;}
  if(t.dataset.k){openSheet(t.dataset.k);return;}
  if(t.dataset.tg){var tv=S.days[cur];if(!isW(tv))return;tv.t=tv.t||[];var ix=tv.t.indexOf(t.dataset.tg);if(ix>-1)tv.t.splice(ix,1);else tv.t.push(t.dataset.tg);save();sheetState();return;}
  if(t.dataset.th){S.theme=t.dataset.th;save();applyTheme();render();return;}
  switch(t.id){
    case 'main':if(!isW(S.days[tk])){var pv=S.days[tk]||{};S.days[tk]={n:pv.n||'',t:pv.t||[]};save();}render();openSheet(tk);break;
    case 'prev':view.setMonth(view.getMonth()-1);render();break;
    case 'next':view.setMonth(view.getMonth()+1);render();break;
    case 'gm':S.goal=Math.max(1,S.goal-1);save();render();break;
    case 'gp':S.goal=Math.min(7,S.goal+1);save();render();break;
    case 'bcopy':
      var j=JSON.stringify({days:S.days,goal:S.goal}),bk=$('bk');bk.value=j;bk.select();S.lastBackup=Date.now();save();
      try{navigator.clipboard.writeText(j).then(function(){$('bm').textContent='Copied.'},function(){$('bm').textContent='Select the text above and copy it.'});}catch(x){$('bm').textContent='Select the text above and copy it.';}
      break;
    case 'brest':
      try{var d=JSON.parse($('bk').value);if(!d||typeof d.days!=='object')throw 0;
        if(!confirm('Replace current records with this backup?'))break;
        S.days=d.days;if(d.goal)S.goal=d.goal;
        Object.keys(S.days).forEach(function(k){var v=S.days[k];if(Array.isArray(v)||!v||typeof v!=='object')S.days[k]={n:''};});
        save();msg='Restored.';render();
      }catch(x){$('bm').textContent='That does not look like a backup.';}
      break;
    case 'bshare':var j2=JSON.stringify({days:S.days,goal:S.goal});if(navigator.share){navigator.share({title:'Tide backup',text:j2}).then(function(){S.lastBackup=Date.now();save();render()}).catch(function(){})}else{try{navigator.clipboard.writeText(j2)}catch(x){}$('bm').textContent='Sharing is not available here. Copied instead.'}break;
    case 'bauto':var sn=JSON.parse(localStorage.getItem(K+'-snap')||'{}'),sk=Object.keys(sn).sort().filter(function(x){return x<tk});if(!sk.length){alert('No earlier auto-backup yet.');break}if(!confirm('Go back to the auto-backup from '+fmt(sk[sk.length-1])+'?'))break;S.days=JSON.parse(sn[sk[sk.length-1]]).days;norm();save();msg='Restored.';render();break;
    case 'upg':
      t.textContent='Updating…';
      var go=function(){location.reload();};
      try{if(window.caches)caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(go,go);else go();}catch(x){go();}
      break;
  }
});
try{addEventListener('gesturestart',function(e){e.preventDefault()});addEventListener('gesturechange',function(e){e.preventDefault()});}catch(e){}
applyTheme();render();
</script>
</body>
</html>
